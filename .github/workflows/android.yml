name: Nexus Android CI/CD Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle Dependencies & Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/configuration-cache
            .gradle/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Setup Permanent Release Keystore
        run: |
          if [ -f release.keystore.base64 ] && [ ! -f release.keystore ]; then
            echo "Decoding release.keystore from base64..."
            base64 -d release.keystore.base64 > release.keystore
          fi
          if [ ! -f release.keystore ]; then
            echo "ERROR: release.keystore is missing!"
            exit 1
          fi
          echo "Permanent release.keystore verified successfully."

      - name: Build Release APK
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          ./gradlew assembleRelease --stacktrace || gradle assembleRelease

      - name: Prepare nexus.apk
        run: |
          mkdir -p release-output
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found built APK: $APK_FILE"
          cp "$APK_FILE" release-output/nexus.apk
          ls -la release-output/

      - name: Extract Version Info
        id: version_step
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/' || echo "1.8.4")
          if [ -z "$VERSION" ]; then VERSION="1.8.4"; fi
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Detected App Version: $VERSION, Target Release Tag: $TAG"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v${{ env.VERSION_NAME }}
          path: release-output/nexus.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Nexus Manga v${{ env.VERSION_NAME }}"
          body: |
            ## 🚀 إصدار جديد لتطبيق Nexus Manga (${{ env.RELEASE_TAG }})
            
            - اعتماد مفتاح توقيع دائم وثابت (release.keystore) لحل مشكلة تعارض الحزم عند التحديث نهائياً.
            - تسمية الحزمة الرسمية nexus.apk مباشرة لتسهيل التثبيت والتحديث.
            - إشعار وتنبيه فوري داخل التطبيق عند توفر أي إصدار جديد جاهز للتحميل.
            - تحسين أداء جلب البيانات السحابية وسلاسة التصفح بدون تعليق.
          draft: false
          prerelease: false
          files: |
            release-output/nexus.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

